# Example for the Casefold server (Hetzner, next to Neo4j). Not deployed: the server step needs Arthur's approval.
# Secrets come from the server's own environment or secret store, never from this file or git.
services:
  crawler:
    build: {context: ../.., dockerfile: deploy/crawler/Dockerfile}
    restart: unless-stopped
    environment:
      CRAWLER_TOKEN: ${CRAWLER_TOKEN:?set on the server}
      CRAWLER_ORIGIN: ${CRAWLER_ORIGIN:-}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set on the server}
      TRONGRID_API_KEY: ${TRONGRID_API_KEY:-}
    volumes: [crawler-data:/data]
    ports: ["127.0.0.1:8090:8090"]     # only the reverse proxy reaches it
volumes:
  crawler-data:
