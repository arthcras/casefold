# casefoldcrypto.com: the website at /, the app at /crypto.html, the crawler API at /api/crawler/ (same origin).
# app.casefoldcrypto.com: the same files, with the app at /.
map $host $home {
    ~^app\.  /crypto.html;
    default  /site.html;
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    types { application/wasm wasm; }
    gzip on;
    gzip_types application/json application/javascript text/css application/wasm;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = / { try_files $home =404; }
    location = /healthz { access_log off; }
    location ~ \.html$ { add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options nosniff always; }
    location /data/ { add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options nosniff always; }
    location /vendor/ { add_header Cache-Control "public, max-age=604800" always; add_header X-Content-Type-Options nosniff always; }

    location /api/crawler/ {
        proxy_pass http://crawler:8090/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        client_max_body_size 64k;
    }
}
