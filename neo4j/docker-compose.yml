# Optional: a local Neo4j Community that plays the central rulebook graph. Loopback only.
services:
  neo4j:
    image: neo4j:5.26-community
    container_name: casefold-neo4j
    ports: ["127.0.0.1:7474:7474", "127.0.0.1:7687:7687"]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in neo4j/.env}
    volumes: ["./rulebook.cypher:/rulebook.cypher:ro"]
