# Trace the listed crypto addresses in data/crypto/chain_seeds.json on chain with public explorers (mempool.space,
# Blockscout, TronGrid), hop 1 and the largest counterparties at hop 2. The result goes to the branch chain-out for
# review; it reaches the code only by a commit a person or Claude makes after checking it. Uses only the workflow's token.
name: chain

on:
  workflow_dispatch:
  push:
    branches: [crypto-intelligence]
    paths: [casefold/fetch_chain.py, data/crypto/chain_seeds.json, .github/workflows/chain.yml]

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Labels for the traced addresses (for new traces run fetch_chain.py with --labels)
        env:
          TRONSCAN_API_KEY: ${{ secrets.TRONSCAN_API_KEY }}
        run: python3 casefold/fetch_chain.py --labels-only
      - name: Put the traces on the branch chain-out
        run: |
          git config user.name "chain workflow"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B chain-out
          git add -f data/crypto/chain/*.json
          git commit -m "chain traces $(date -u +%F)" || echo "nothing new"
          git push -f origin chain-out
