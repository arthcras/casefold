# Fetch the sanctions lists (OFAC SDN with its crypto addresses, EU, UN, UK) every day and keep what crypto screening
# needs under data/crypto/sanctions/. The result goes to the branch sanctions-out for review; it reaches the code only by
# a commit that a person or Claude makes after checking it. The daily schedule runs once this file is on the default branch.
# Uses only the workflow's own token.
name: sanctions

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
  push:
    branches: [crypto-intelligence]
    paths: [casefold/fetch_sanctions.py, data/crypto/sanctions_lists.json, .github/workflows/sanctions.yml]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch the lists
        run: python3 casefold/fetch_sanctions.py
      - name: Put the lists on the branch sanctions-out
        run: |
          git config user.name "sanctions workflow"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B sanctions-out
          git add -f data/crypto/sanctions/*.json
          git commit -m "sanctions lists $(date -u +%F)" || echo "nothing new"
          git push -f origin sanctions-out
